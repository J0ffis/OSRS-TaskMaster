displayName=OSRS TaskMaster
author=Joffis
support=https://github.com/J0ffis/OSRS-TaskMaster
description=Copies your own progress (levels, quests, diaries, combat achievements, collection log) so the OSRS TaskMaster website can suggest what to grind next. Never reads your bank, inventory or gear.
tags=goals,planner,collection log,combat achievements,diary,quests,grind,suggestions
plugins=com.osrstaskmaster.TaskMasterPlugin
warning=This plugin can send your account progress (levels, quests, diaries, combat achievements and collection log) to a server address you enter in its settings. This is off by default; nothing is sent unless you switch on "Send to my own server".
