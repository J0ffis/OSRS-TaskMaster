description=Suggests what to grind next from your own progress (levels, quests, diaries, combat achievements, collection log) on the OSRS TaskMaster website. Never reads your bank, inventory or gear.
tags=goals,planner,collection log,combat achievements,diary,quests,grind,suggestions
plugins=com.osrstaskmaster.TaskMasterPlugin
warning=If you switch on Automatic upload (off by default), this plugin sends your levels, quests, diaries, combat achievements and collection log to the OSRS TaskMaster server, which shows them on its website. Your IP address will be visible to that server. Nothing is sent unless you switch it on.
