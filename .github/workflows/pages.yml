# Publishes the website (the web/ folder) to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is plain static files: no build step, no server. Profiles are pasted in by each
# player and kept in their own browser.
#
# Before publishing, the checks job runs the knowledge-base checker and the suggestion tests
# (tests/). If either fails, the site isn't published and the live site stays as it was.
name: Publish website

on:
  push:
    branches: [main]
    # scripts/update-quest-reqs.mjs is in the list because tests/quest-reqs.test.mjs imports it.
    paths: ["web/**", "tests/**", "scripts/update-quest-reqs.mjs", "package.json", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**", "tests/**", "scripts/update-quest-reqs.mjs", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check knowledge-base.js
        run: node tests/check-knowledge-base.mjs
      - name: Suggestion tests
        run: node --test "tests/*.test.mjs"

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
